name: gandal-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gandal-dev-frontend:latest
    container_name: gandal-dev-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # The auth middleware runs server-side inside this container and calls the API
    # by its public nip.io hostname; Docker's DNS can't resolve nip.io, so we point
    # it at the host gateway, where iwm-gateway (:80) routes it to gandal-api.
    extra_hosts:
      - "gandal.10.50.30.102.nip.io:host-gateway"
    expose:
      - "3000"
    networks:
      - gateway-net

networks:
  # Shared gateway network: lets iwm-gateway reverse-proxy to gandal-dev-frontend:3000
  gateway-net:
    external: true
    name: iwm-vm-network
